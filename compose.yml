name: ofertasuper-cmvp-local-bootstrap
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ofertasuper
      POSTGRES_USER: ofertasuper_owner
      POSTGRES_PASSWORD: owner-local-only
      APP_PASSWORD: app-local-only
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/compose/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ofertasuper_owner -d ofertasuper"]
      interval: 2s
      timeout: 3s
      retries: 20
  role-provision:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ofertasuper
      POSTGRES_USER: ofertasuper_owner
      APP_PASSWORD: app-local-only
      PGPASSWORD: owner-local-only
      PGHOST: postgres
    volumes:
      - ./docker/compose/init-app-role.sh:/harness/init-app-role.sh:ro
    entrypoint: ["/bin/sh", "/harness/init-app-role.sh"]
    depends_on:
      postgres: { condition: service_healthy }
  migrate:
    build: { context: ., target: migrator }
    environment:
      DATABASE_URL: postgresql://ofertasuper_owner:owner-local-only@postgres:5432/ofertasuper
      DIRECT_URL: postgresql://ofertasuper_owner:owner-local-only@postgres:5432/ofertasuper
    depends_on:
      role-provision: { condition: service_completed_successfully }
  grants:
    image: postgres:16-bookworm
    environment: { PGPASSWORD: owner-local-only }
    volumes:
      - ./docker/compose/app-grants.sql:/harness/app-grants.sql:ro
    command: >-
      psql -h postgres -U ofertasuper_owner -d ofertasuper -v ON_ERROR_STOP=1 -f /harness/app-grants.sql
    depends_on:
      migrate: { condition: service_completed_successfully }
  seed:
    build: { context: ., target: seeder }
    environment:
      DATABASE_URL: postgresql://ofertasuper_app:app-local-only@postgres:5432/ofertasuper
    volumes:
      - ./prisma:/app/prisma:ro
    command: ./node_modules/.bin/tsx prisma/seed.ts
    depends_on:
      grants: { condition: service_completed_successfully }
volumes:
  postgres-data:
