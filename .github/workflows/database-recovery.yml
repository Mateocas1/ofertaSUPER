name: Encrypted database recovery

on:
  workflow_dispatch:
    inputs:
      manifest_key:
        description: Logical manifest basename to recover
        required: true
        type: string

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RECOVERY_MANIFEST_KEY: ${{ inputs.manifest_key }}
      RCLONE_CRYPT_REMOTE: ${{ vars.RCLONE_CRYPT_REMOTE }}
      PG_IMAGE: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_CRYPT_TYPE: crypt
      RCLONE_CONFIG_CRYPT_REMOTE: r2:${{ vars.R2_BUCKET }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned rclone
        run: |
          curl --fail --silent --show-error --location --output rclone-v1.75.0-linux-amd64.zip https://downloads.rclone.org/v1.75.0/rclone-v1.75.0-linux-amd64.zip
          echo 'aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa  rclone-v1.75.0-linux-amd64.zip' | sha256sum --check --status
          unzip -q rclone-v1.75.0-linux-amd64.zip
          install -m 0755 rclone-v1.75.0-linux-amd64/rclone "$RUNNER_TEMP/rclone"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Derive rclone crypt passwords
        env:
          RCLONE_CRYPT_PASSWORD_PLAINTEXT: ${{ secrets.RCLONE_CRYPT_PASSWORD }}
          RCLONE_CRYPT_PASSWORD2_PLAINTEXT: ${{ secrets.RCLONE_CRYPT_PASSWORD2 }}
        run: |
          if [[ -z "$RCLONE_CRYPT_PASSWORD_PLAINTEXT" || -z "$RCLONE_CRYPT_PASSWORD2_PLAINTEXT" || "$RCLONE_CRYPT_PASSWORD_PLAINTEXT" == *$'\n'* || "$RCLONE_CRYPT_PASSWORD_PLAINTEXT" == *$'\r'* || "$RCLONE_CRYPT_PASSWORD2_PLAINTEXT" == *$'\n'* || "$RCLONE_CRYPT_PASSWORD2_PLAINTEXT" == *$'\r'* ]]; then
            echo "RCLONE crypt passwords must be non-empty single-line plaintext" >&2
            exit 1
          fi
          primary_crypt_password="$(printf '%s' "$RCLONE_CRYPT_PASSWORD_PLAINTEXT" | "$RUNNER_TEMP/rclone" obscure -)"
          secondary_crypt_password="$(printf '%s' "$RCLONE_CRYPT_PASSWORD2_PLAINTEXT" | "$RUNNER_TEMP/rclone" obscure -)"
          printf '::add-mask::%s\n' "$primary_crypt_password"
          printf '::add-mask::%s\n' "$secondary_crypt_password"
          printf 'RCLONE_CONFIG_CRYPT_PASSWORD=%s\n' "$primary_crypt_password" >> "$GITHUB_ENV"
          printf 'RCLONE_CONFIG_CRYPT_PASSWORD2=%s\n' "$secondary_crypt_password" >> "$GITHUB_ENV"
      - run: npm run recovery:postgres-r2
