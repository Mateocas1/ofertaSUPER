name: Encrypted database backup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_RETENTION: ${{ vars.BACKUP_RETENTION }}
      BACKUP_DATABASE_ROLE: ${{ vars.BACKUP_DATABASE_ROLE }}
      RCLONE_CRYPT_REMOTE: ${{ vars.RCLONE_CRYPT_REMOTE }}
      PG_IMAGE: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_CRYPT_TYPE: crypt
      RCLONE_CONFIG_CRYPT_REMOTE: r2:${{ vars.R2_BUCKET }}
      RCLONE_CONFIG_CRYPT_PASSWORD: ${{ secrets.RCLONE_CRYPT_PASSWORD }}
      RCLONE_CONFIG_CRYPT_PASSWORD2: ${{ secrets.RCLONE_CRYPT_PASSWORD2 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned rclone
        run: |
          curl --fail --silent --show-error --location --output rclone-v1.75.0-linux-amd64.zip https://downloads.rclone.org/v1.75.0/rclone-v1.75.0-linux-amd64.zip
          echo 'aa2804e08f48250e71009c727124b6341cd0288465804a9a09d14663cabafbaa  rclone-v1.75.0-linux-amd64.zip' | sha256sum --check --status
          unzip -q rclone-v1.75.0-linux-amd64.zip
          install -m 0755 rclone-v1.75.0-linux-amd64/rclone "$RUNNER_TEMP/rclone"
          "$RUNNER_TEMP/rclone" version | grep --fixed-strings 'rclone v1.75.0'
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Stream, validate, publish, and retain encrypted backup
        run: npm run backup:postgres-r2
