name: Lighthouse CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  complexity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run complexity governance
        run: npm run audit:complexity

  lighthouse:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CATALOG_OFFLINE_MODE: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Start application
        run: npm run start -- --hostname 127.0.0.1 --port 3000 &

      - name: Wait for server
        run: |
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000 > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Server did not start in time"
          exit 1

      - name: Warm audited routes
        run: |
          for url in \
            http://127.0.0.1:3000/ \
            http://127.0.0.1:3000/ofertas \
            'http://127.0.0.1:3000/buscar?q=yerba' \
            http://127.0.0.1:3000/canasta; do
            curl --silent --fail "$url" > /dev/null
          done

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          urls: |
            http://127.0.0.1:3000/
            http://127.0.0.1:3000/ofertas
            http://127.0.0.1:3000/buscar?q=yerba
            http://127.0.0.1:3000/canasta
          uploadArtifacts: true
          temporaryPublicStorage: true
