name: Daily catalog refresh

on:
  schedule:
    # Two off-peak triggers: GitHub delays or drops top-of-hour crons under
    # load (the old "0 10 * * *" never fired a single scheduled run), so the
    # day's refresh runs at 10:23 UTC and the 14:41 UTC window is a backup.
    # The guard job below keeps the backup from refreshing twice in one UTC
    # day. One writer only: the local crontab line is removed once this job is
    # green (see docs/RUNBOOK.md).
    - cron: "23 10 * * *"
    - cron: "41 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Restore and refresh with the gates, but do not upload state or commit the snapshot
        type: boolean
        default: false

concurrency:
  group: daily-refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  guard:
    name: Skip a duplicate scheduled refresh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      weeklyChart: ${{ steps.check.outputs.weeklyChart }}
    permissions:
      contents: read
    steps:
      - name: Checkout master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: master
          fetch-depth: 0

      # Schedule only: a workflow_dispatch run is always an explicit decision to
      # refresh, so it leaves the outputs empty and the refresh job runs.
      - name: Check today's cloud refresh on master
        id: check
        if: ${{ github.event_name == 'schedule' }}
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          subject="chore(catalog): refresh ${today} [cloud]"
          if git log origin/master --fixed-strings --grep="$subject" -n 1 --pretty=%H | grep -q .; then
            echo "master already has today's refresh (${today}); the backup window has nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "$(date -u +%u)" = "1" ]; then
            echo "weeklyChart=true" >> "$GITHUB_OUTPUT"
          else
            echo "weeklyChart=false" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    name: Restore, refresh and publish
    needs: guard
    if: ${{ needs.guard.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: ofertasuper
          POSTGRES_USER: ofertasuper_owner
          # Throwaway password for the ephemeral runner container; never printed.
          POSTGRES_PASSWORD: ofertasuper-cloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ofertasuper_owner -d ofertasuper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ofertasuper_owner:ofertasuper-cloud@localhost:5432/ofertasuper
      DIRECT_URL: postgresql://ofertasuper_owner:ofertasuper-cloud@localhost:5432/ofertasuper
      PGPASSWORD: ofertasuper-cloud
    steps:
      - name: Checkout master
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Publishing runs always use master. A manual dry run may test the
          # branch it was dispatched from, since it never uploads or commits.
          ref: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && github.ref || 'master' }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Download and restore the database state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          LOG_FILE="$RUNNER_TEMP/cloud-refresh.log"
          echo restore > "$RUNNER_TEMP/cloud-refresh-stage.txt"
          scripts/db-state.sh download "$RUNNER_TEMP/state" 2>&1 | tee -a "$LOG_FILE"
          STATE_DUMP=$(find "$RUNNER_TEMP/state" -maxdepth 1 -name 'ofertasuper-*.dump' | head -n1)
          scripts/db-state.sh restore "$STATE_DUMP" 2>&1 | tee -a "$LOG_FILE"

      - name: Apply migrations
        run: |
          set -o pipefail
          LOG_FILE="$RUNNER_TEMP/cloud-refresh.log"
          echo migrate > "$RUNNER_TEMP/cloud-refresh-stage.txt"
          npx prisma migrate deploy 2>&1 | tee -a "$LOG_FILE"

      - name: Refresh the catalog (gates enforced)
        run: |
          set -o pipefail
          LOG_FILE="$RUNNER_TEMP/cloud-refresh.log"
          echo refresh > "$RUNNER_TEMP/cloud-refresh-stage.txt"
          npm run refresh:catalog 2>&1 | tee -a "$LOG_FILE"

      - name: Dump, upload and prune the state
        if: ${{ success() && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          LOG_FILE="$RUNNER_TEMP/cloud-refresh.log"
          echo upload > "$RUNNER_TEMP/cloud-refresh-stage.txt"
          scripts/db-state.sh dump "$RUNNER_TEMP/state.dump" 2>&1 | tee -a "$LOG_FILE"
          scripts/db-state.sh upload "$RUNNER_TEMP/state.dump" 2>&1 | tee -a "$LOG_FILE"
          scripts/db-state.sh prune 2>&1 | tee -a "$LOG_FILE"

      - name: Export the daily price series and refresh the basket index
        if: ${{ success() && inputs.dry_run != true }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          LOG_FILE="$RUNNER_TEMP/cloud-refresh.log"
          echo analytics > "$RUNNER_TEMP/cloud-refresh-stage.txt"
          scripts/export-analytics.sh 2>&1 | tee -a "$LOG_FILE"

      - name: Export the price drops
        if: ${{ success() && inputs.dry_run != true }}
        continue-on-error: true
        run: |
          set -o pipefail
          LOG_FILE="$RUNNER_TEMP/cloud-refresh.log"
          npx tsx scripts/export-price-drops.ts 2>&1 | tee -a "$LOG_FILE"

      - name: Commit the snapshot and the price drops to master
        if: ${{ success() && inputs.dry_run != true }}
        run: |
          set -euo pipefail
          LOG_FILE="$RUNNER_TEMP/cloud-refresh.log"
          echo commit > "$RUNNER_TEMP/cloud-refresh-stage.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog-snapshot.json data/price-drops.json
          if git diff --cached --quiet; then
            echo "snapshot and price drops unchanged; nothing to publish" | tee -a "$LOG_FILE"
          else
            git commit -m "chore(catalog): refresh $(date -u +%F) [cloud]"
            # master can move during the ~25-minute run (a merge, another
            # data commit): rebase this data-only commit onto it and retry.
            for attempt in 1 2 3; do
              git pull --rebase --quiet origin master && git push origin HEAD:master && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 5
            done 2>&1 | tee -a "$LOG_FILE"
          fi

      - name: Regenerate the README price chart (weekly, best effort)
        if: ${{ success() && inputs.dry_run != true && needs.guard.outputs.weeklyChart == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          LOG_FILE="$RUNNER_TEMP/cloud-refresh.log"
          echo chart > "$RUNNER_TEMP/cloud-refresh-stage.txt"
          npx tsx scripts/chart-price-evolution.ts 2>&1 | tee -a "$LOG_FILE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics/assets/price-evolution.png README.md
          if git diff --cached --quiet; then
            echo "price chart unchanged; nothing to publish" | tee -a "$LOG_FILE"
          else
            git commit -m "chore(analytics): refresh the price chart $(date -u +%F) [cloud]"
            # master can move during the ~25-minute run (a merge, another
            # data commit): rebase this data-only commit onto it and retry.
            for attempt in 1 2 3; do
              git pull --rebase --quiet origin master && git push origin HEAD:master && break
              if [ "$attempt" = 3 ]; then exit 1; fi
              sleep 5
            done 2>&1 | tee -a "$LOG_FILE"
          fi

      - name: Post the price drops digest to Telegram
        if: ${{ success() && inputs.dry_run != true && github.event_name == 'schedule' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          set -o pipefail
          LOG_FILE="$RUNNER_TEMP/cloud-refresh.log"
          npx tsx scripts/post-price-drops.ts 2>&1 | tee -a "$LOG_FILE"

      - name: Close the failure tracking issue
        if: ${{ success() && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUD_REFRESH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo resolve > "$RUNNER_TEMP/cloud-refresh-stage.txt"
          npx tsx scripts/cloud-refresh-report.ts resolve

      - name: Report failure
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUD_REFRESH_LOG: ${{ runner.temp }}/cloud-refresh.log
          CLOUD_REFRESH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STAGE_FILE="$RUNNER_TEMP/cloud-refresh-stage.txt"
          if [ -f "$STAGE_FILE" ]; then
            STAGE_NAME="$(cat "$STAGE_FILE")"
            export CLOUD_REFRESH_STAGE="$STAGE_NAME"
          fi
          npx tsx scripts/cloud-refresh-report.ts fail
