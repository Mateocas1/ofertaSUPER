[project]
name = "ofertasuper-analytics"
version = "0.1.0"
description = "DuckDB + dbt analytics product for ofertaSUPER: dense daily price series and a Laspeyres basket index."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dbt-duckdb==1.11.0",
    "duckdb==1.5.6",
]

[dependency-groups]
dev = [
    "matplotlib==3.11.2",
]

[tool.uv]
package = false
